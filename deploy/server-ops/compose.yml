services:
  web:
    image: ${SERVER_OPS_IMAGE:?Set an immutable image}
    container_name: server-ops-web
    restart: unless-stopped
    init: true
    cpus: "0.25"
    mem_limit: 96m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=8m,mode=1777]
    volumes:
      - /opt/server-ops/state:/data:ro
      - /opt/server-ops/shared/auth.json:/run/secrets/ops-auth.json:ro
      - /opt/server-ops/external:/external:rw
    networks: [edge]
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8793/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
    external: true
    name: server_ops_edge
